parameters:
- name: repo
  type: string
- name: scriptEnvVariables
  type: string
- name: expectedCredentialProviderVersion
  type: string

steps:
- checkout: ${{ parameters.repo }}
- bash: |
    ${{ parameters.scriptEnvVariables }}
    ./helpers/installcredprovider.sh -Force >> ./output.log
    cat ./output.log

    if ! grep ${{ parameters.expectedCredentialProviderVersion }} ./output.log; then
      echo "Expected credential provider not found"
      exit 1
    fi
    if [ ! -d "$HOME/.nuget/plugins/netcore/CredentialProvider.Microsoft" ]; then
      echo "Credential provider plugin directory not found"
      exit 1
    fi

    # For self-contained (RID-specific) installs, verify the native apphost is executable.
    # This is skipped for runtime-dependent installs, which ship only a managed .dll.
    CREDENTIAL_PROVIDER_APPHOST="$HOME/.nuget/plugins/netcore/CredentialProvider.Microsoft/CredentialProvider.Microsoft"
    if [ -f "$CREDENTIAL_PROVIDER_APPHOST" ]; then
      if [ ! -x "$CREDENTIAL_PROVIDER_APPHOST" ]; then
        echo "Credential provider apphost is missing the executable (+x) bit: $CREDENTIAL_PROVIDER_APPHOST"
        ls -l "$CREDENTIAL_PROVIDER_APPHOST"
        exit 1
      fi
      echo "Verified credential provider apphost has the executable (+x) bit set"
    fi
    
    echo "Credential provider installed successfully"
  workingDirectory: $(Build.SourcesDirectory)
  displayName: Validate Install Script (bash)
- bash: |
    if grep $'\r' ./helpers/installcredprovider.sh; then 
      echo "CRLF line ending found"
      exit 1
    fi
  workingDirectory: $(Build.SourcesDirectory)
  displayName: Check Line Endings