parameters:
- name: repo
  type: string
- name: scriptEnvVariables
  type: string
- name: expectedCredentialProviderVersion
  type: string
- name: releaseVersion
  type: string
  default: 'latest'

steps:
- checkout: ${{ parameters.repo }}
- bash: |
    ${{ parameters.scriptEnvVariables }}
    
    RELEASE_VERSION="${{ parameters.releaseVersion }}"
    if [ ! "$RELEASE_VERSION" = "latest" ]; then
      export AZURE_ARTIFACTS_CREDENTIAL_PROVIDER_VERSION="$RELEASE_VERSION"
      sh ./helpers/installcredproviderrelease.sh -Force >> ./output.log 2>&1
    fi
    sh ./helpers/installcredproviderrelease.sh -Force >> ./output.log 
    
    cat ./output.log

    # Check if expected credential provider version was found in output
    if ! grep "${{ parameters.expectedCredentialProviderVersion }}" ./output.log; then
      echo "Expected credential provider not found in output"
      exit 1
    fi
    
    # Verify the credential provider directory was created
    if [ ! -d "$HOME/.nuget/plugins/netcore/CredentialProvider.Microsoft" ]; then
      echo "Credential provider plugin directory not found at: $HOME/.nuget/plugins/netcore/CredentialProvider.Microsoft"
      exit 1
    fi

    # For self-contained (RID-specific) installs, verify the native apphost is executable.
    # This is skipped for runtime-dependent installs, which ship only a managed .dll.
    CREDENTIAL_PROVIDER_APPHOST="$HOME/.nuget/plugins/netcore/CredentialProvider.Microsoft/CredentialProvider.Microsoft"
    if [ -f "$CREDENTIAL_PROVIDER_APPHOST" ]; then
      if [ ! -x "$CREDENTIAL_PROVIDER_APPHOST" ]; then
        echo "Credential provider apphost is missing the executable (+x) bit: $CREDENTIAL_PROVIDER_APPHOST"
        ls -l "$CREDENTIAL_PROVIDER_APPHOST"
        exit 1
      fi
      echo "Verified credential provider apphost has the executable (+x) bit set"
    fi
    
    echo "Credential provider installed successfully via release script with sh"
  workingDirectory: $(Build.SourcesDirectory)
  displayName: Validate Install Release Script (sh)
- bash: |
    if grep $'\r' ./helpers/installcredproviderrelease.sh; then 
      echo "CRLF line ending found"
      exit 1
    fi
  workingDirectory: $(Build.SourcesDirectory)
  displayName: Check Line Endings
